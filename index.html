<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Révisions</title>
<meta name="description" content="Révisions de la maturité suisse, partiel 1 : QCM par matière, thème et objectif.">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Révisions">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&display=swap">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}[hidden]{display:none!important}img{max-width:100%}</style>
</head>
<body>
<style>
:root{
  --bg:#FFFFFF; --ink:#0B0B0B; --muted:#6B6B6B; --line:#E3E3E3; --soft:#F4F4F4; --card:#FFFFFF;
  --lip:#BDBDBD; --plip:#4A4A4A;
  --ok:#139A47; --okbg:#E7F7ED; --ko:#E0383E; --kobg:#FDECEC;
  --bio:#16A34A; --his:#E0393E; --phy:#2F6BEB; --chi:#8B3FE0; --geo:#0A94AA; --art:#E2457A;
  --logoring:transparent; --acc:var(--ink);
  font-family:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#000000; --ink:#F3F3F3; --muted:#9A9A9A; --line:#2B2B2B; --soft:#131313; --card:#0B0B0B;
  --lip:#3A3A3A; --plip:#9C9C9C; --logoring:#3A3A3A;
  --ok:#2EC266; --okbg:#0D2618; --ko:#FF5E64; --kobg:#2C1013;
  --bio:#22B35E; --his:#F0484D; --phy:#4A80F5; --chi:#9D57EE; --geo:#16AAC0; --art:#F05A8C;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000000; --ink:#F3F3F3; --muted:#9A9A9A; --line:#2B2B2B; --soft:#131313; --card:#0B0B0B;
  --lip:#3A3A3A; --plip:#9C9C9C; --logoring:#3A3A3A;
  --ok:#2EC266; --okbg:#0D2618; --ko:#FF5E64; --kobg:#2C1013;
  --bio:#22B35E; --his:#F0484D; --phy:#4A80F5; --chi:#9D57EE; --geo:#16AAC0; --art:#F05A8C;
  color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{margin:0;font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:#000;z-index:70}
#app{max-width:560px;margin:0 auto;padding-block:14px 48px}
h1,h2,h3,.disp{font-family:"Bricolage Grotesque","Atkinson Hyperlegible",system-ui,sans-serif;letter-spacing:-.01em;margin:0;text-wrap:balance}
button{font:inherit;color:inherit}
.muted{color:var(--muted)}
.row{display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0}
svg{display:block}

/* boutons façon jeu */
.btn{appearance:none;display:flex;align-items:center;justify-content:center;gap:10px;width:100%;border:2px solid var(--line);background:var(--card);
  border-radius:16px;padding:14px 16px;font-weight:700;font-size:1rem;box-shadow:0 4px 0 var(--lip);cursor:pointer;
  transition:transform .07s ease,box-shadow .07s ease;touch-action:manipulation;text-align:left}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--lip)}
.btn:disabled{opacity:.45;cursor:default}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink);box-shadow:0 4px 0 var(--plip);justify-content:center;text-align:center}
.btn.primary:active{box-shadow:0 1px 0 var(--plip)}
.btn.acc{background:var(--acc);color:#fff;border-color:color-mix(in srgb,var(--acc) 78%,#000);box-shadow:0 4px 0 color-mix(in srgb,var(--acc) 70%,#000);justify-content:center;text-align:center}
.btn.acc:active{box-shadow:0 1px 0 color-mix(in srgb,var(--acc) 70%,#000)}
.btn.small{padding:9px 12px;font-size:.9rem;border-radius:12px;width:auto;box-shadow:0 3px 0 var(--lip)}
.icbtn{appearance:none;width:44px;height:44px;flex:none;display:grid;place-items:center;border:2px solid var(--line);background:var(--card);border-radius:14px;box-shadow:0 3px 0 var(--lip);cursor:pointer;padding:0}
.icbtn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--lip)}
.icbtn svg{width:22px;height:22px}

/* logo */
.logo{width:40px;height:40px;border-radius:11px;background:#000;display:grid;place-items:center;flex:none;box-shadow:0 0 0 2px var(--logoring)}
.logo svg{width:32px;height:32px}

/* accueil */
.top{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.top h1{font-size:2rem;font-weight:800;line-height:1}
.hello{font-size:1.02rem;margin:-6px 0 16px}
.hud{background:#000;color:#fff;border-radius:22px;padding:16px;display:grid;gap:14px}
:root[data-theme="dark"] .hud{background:var(--soft);border:2px solid var(--line)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .hud{background:var(--soft);border:2px solid var(--line)}}
.lvl{display:flex;align-items:center;gap:12px}
.lvlnum{width:52px;height:52px;border-radius:50%;background:#fff;color:#000;display:grid;place-items:center;flex:none;font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:1.45rem}
.lvl b{font-family:"Bricolage Grotesque",sans-serif;font-size:1.15rem}
.bar{display:block;height:12px;border-radius:99px;background:rgba(127,127,127,.28);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:currentColor;transition:width .5s ease}
.hud .bar>i{background:#fff}
.lvl small{opacity:.75;font-size:.85rem}
.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.chip{background:rgba(255,255,255,.1);border-radius:14px;padding:10px 8px;display:grid;justify-items:center;gap:2px;text-align:center}
.chip svg{width:22px;height:22px}
.chip b{font-family:"Bricolage Grotesque",sans-serif;font-size:1.25rem;line-height:1.1}
.chip span{font-size:.75rem;opacity:.75;line-height:1.2}
.sec{display:flex;align-items:baseline;justify-content:space-between;margin:26px 0 12px}
.sec h2{font-size:1.25rem;font-weight:800}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.subj{appearance:none;border:0;text-align:left;cursor:pointer;background:var(--c);color:#fff;border-radius:20px;padding:14px 14px 13px;min-height:150px;
  display:flex;flex-direction:column;gap:6px;box-shadow:0 5px 0 color-mix(in srgb,var(--c) 66%,#000);position:relative;overflow:hidden;touch-action:manipulation;transition:transform .07s,box-shadow .07s}
.subj:active{transform:translateY(4px);box-shadow:0 1px 0 color-mix(in srgb,var(--c) 66%,#000)}
.subj::after{content:"";position:absolute;right:-26px;top:-26px;width:86px;height:86px;border-radius:50%;border:12px solid rgba(255,255,255,.16)}
.subj .nm{display:block;font-family:"Bricolage Grotesque",sans-serif;font-size:1.08rem;font-weight:800;line-height:1.15;padding-right:26px}
.subj .big{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:2.3rem;line-height:1;margin-top:auto}
.subj .bar{height:8px;background:rgba(0,0,0,.22)}
.subj .bar>i{background:#fff}
.subj small{font-size:.8rem;opacity:.92;line-height:1.25}
.btn.cta{display:grid;grid-template-columns:auto 1fr auto;gap:12px;text-align:left;justify-content:stretch;padding:14px 16px}
.cta .mi{width:44px;height:44px;border-radius:50%;background:var(--bg);color:var(--ink);display:grid;place-items:center}
.cta .mi svg{width:20px;height:20px;margin-left:2px}
.cta b{display:block;font-family:"Bricolage Grotesque",sans-serif;font-size:1.15rem;line-height:1.2}
.cta small{display:block;font-weight:400;opacity:.75;font-size:.85rem}
.cta>svg{width:22px;height:22px;opacity:.7}
.hint{border:2px dashed var(--line);border-radius:18px;padding:14px;margin-top:22px;display:grid;gap:8px;font-size:.95rem}
.hint b{font-family:"Bricolage Grotesque",sans-serif;font-size:1.05rem}
.foot{font-size:.82rem;margin-top:22px;text-align:center}

/* matière */
.head{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.head h1{font-size:1.55rem;font-weight:800}
.hero{background:var(--acc);color:#fff;border-radius:22px;padding:16px;display:flex;align-items:center;gap:16px;box-shadow:0 5px 0 color-mix(in srgb,var(--acc) 66%,#000)}
.hero .facts{display:grid;gap:4px;font-size:.95rem}
.hero .facts b{font-family:"Bricolage Grotesque",sans-serif;font-size:1.1rem}
.modes{display:grid;gap:12px;margin-top:20px}
.mode{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px}
.mode .mi{width:44px;height:44px;border-radius:50%;background:var(--acc);color:#fff;display:grid;place-items:center}
.mode .mi svg{width:22px;height:22px}
.mode .mi.ink{background:var(--ink);color:var(--bg)}
.mode b{display:block;font-family:"Bricolage Grotesque",sans-serif;font-size:1.08rem;line-height:1.2}
.mode small{display:block;color:var(--muted);font-weight:400;font-size:.85rem;line-height:1.3}
.mode .bar{height:6px;margin-top:6px;color:var(--acc)}
.mode .go{width:22px;height:22px;color:var(--muted)}
.chap{border:2px solid var(--line);border-radius:18px;overflow:hidden;background:var(--card)}
.chap+.chap{margin-top:10px}
.chap>button{appearance:none;border:0;background:none;width:100%;text-align:left;padding:12px 14px;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;cursor:pointer}
.num{width:34px;height:34px;border-radius:50%;border:3px solid var(--acc);display:grid;place-items:center;font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:.95rem;flex:none}
.num.full{background:var(--acc);color:#fff}
.chap .t{font-weight:700;line-height:1.25}
.chap .bar{height:6px;margin-top:7px;color:var(--acc)}
.stars{display:flex;gap:1px;justify-content:flex-end}
.stars svg{width:15px;height:15px}
.stars .on{color:var(--acc)} .stars .off{color:var(--line)}
.pc{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;text-align:right;font-size:.95rem}
.chap .body{padding:2px 14px 14px;display:grid;gap:10px}
.obj{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding-top:10px;border-top:1px solid var(--line)}
.obj p{margin:0;font-size:.9rem;line-height:1.35}
.obj p span{display:block;font-size:.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:2px}
.danger{margin-top:26px;display:flex;justify-content:center}

/* quiz */
.qtop{display:flex;align-items:center;gap:12px}
.qtop .bar{flex:1;height:16px;color:var(--acc);background:var(--soft);border:2px solid var(--line)}
.qtop .cnt{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;min-width:44px;text-align:right}
.combo{display:flex;align-items:center;justify-content:center;gap:8px;margin:16px 0 4px}
.slot{width:24px;height:24px;border-radius:50%;border:3px solid var(--line);position:relative}
.slot.on{border-color:var(--acc);background:var(--acc);animation:drop .38s cubic-bezier(.3,1.6,.5,1)}
.slot.out{animation:pop .3s ease}
.pw{font-family:"Times New Roman",Georgia,"Latin Modern Roman",serif;font-style:italic;font-weight:700;font-size:1.7rem;line-height:1;margin-left:6px;color:var(--acc);min-width:38px}
.pw sup{font-style:normal;font-size:.6em;vertical-align:.75em;margin-left:1px}
@keyframes drop{0%{transform:translateY(-26px);opacity:0}100%{transform:none;opacity:1}}
@keyframes pop{0%{transform:scale(1.25)}100%{transform:none}}
.ql{font-size:.74rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:18px 0 8px;line-height:1.35}
.tag{display:inline-block;background:var(--acc);color:#fff;border-radius:99px;padding:2px 10px;font-size:.72rem;margin-bottom:6px;letter-spacing:.04em}
.qq{font-family:"Bricolage Grotesque",sans-serif;font-size:1.32rem;font-weight:700;line-height:1.28;margin:0 0 18px;text-wrap:pretty}
.opts{display:grid;gap:11px}
.opt{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;font-weight:400;padding:13px 14px}
.opt .k{width:32px;height:32px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:.9rem;flex:none}
.opt .mk{width:24px;height:24px}
.opt.ok{background:var(--okbg);border-color:var(--ok);box-shadow:0 4px 0 var(--ok)}
.opt.ok .k{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.ko{background:var(--kobg);border-color:var(--ko);box-shadow:0 4px 0 var(--ko);animation:shake .35s}
.opt.ko .k{background:var(--ko);border-color:var(--ko);color:#fff}
.opt:disabled{opacity:1;cursor:default}
.opt.dim{opacity:.45}
.opt.ok .mk{color:var(--ok)} .opt.ko .mk{color:var(--ko)}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.spacer{height:260px}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:40;padding:18px max(16px,env(safe-area-inset-left,0px)) calc(18px + env(safe-area-inset-bottom,0px));
  border-top:3px solid var(--fc);background:var(--fb);animation:up .25s ease;max-height:72vh;overflow:auto}
.sheet .in{max-width:560px;margin:0 auto;display:grid;gap:10px}
.sheet h3{font-size:1.25rem;line-height:1.2;font-weight:800;color:var(--fc);display:flex;align-items:center;gap:10px}
.sheet h3 svg{width:30px;height:30px;flex:none}
.sheet h3 .xp{margin-left:auto;white-space:nowrap;flex:none;font-size:.95rem;background:var(--fc);color:#fff;border-radius:99px;padding:3px 10px}
.sheet p{margin:0;font-size:.98rem}
.sheet .btn{margin-top:4px}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}

/* fin de série */
.end{text-align:center;display:grid;gap:14px;justify-items:center;padding-top:8px}
.end h1{font-size:2.2rem;font-weight:800}
.score{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:4.2rem;line-height:1}
.score small{font-size:1.6rem;color:var(--muted)}
.pills{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.pill{border:2px solid var(--line);border-radius:99px;padding:6px 12px;font-weight:700;font-size:.9rem;display:flex;align-items:center;gap:6px}
.pill svg{width:18px;height:18px}
.endbtns{display:grid;gap:12px;width:100%;margin-top:6px}
.miss{width:100%;text-align:left;border:2px solid var(--line);border-radius:18px;padding:4px 14px}
.miss summary{cursor:pointer;font-weight:700;padding:10px 0}
.miss .m{border-top:1px solid var(--line);padding:10px 0;font-size:.92rem;display:grid;gap:4px}
.miss .m b{color:var(--ok)}
.goalbox{width:100%;border:2px solid var(--line);border-radius:18px;padding:12px 14px;display:grid;gap:8px;text-align:left}
.goalbox .bar{color:var(--ink)}

/* effets */
#fx{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:60}
.disc{position:absolute;top:-40px;border-radius:50%;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(115vh) rotate(160deg)}}
.float{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 62px);transform:translateX(-50%);font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:1.6rem;color:var(--acc);animation:rise 1s ease forwards;pointer-events:none;z-index:61}
@keyframes rise{0%{opacity:0;transform:translate(-50%,10px)}20%{opacity:1}100%{opacity:0;transform:translate(-50%,-50px)}}
.banner{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);z-index:62;pointer-events:none;background:#000;color:#fff;border-radius:22px;padding:16px 22px;text-align:center;animation:boom 1.5s ease forwards;box-shadow:0 8px 0 var(--acc)}
.banner b{display:block;font-family:"Bricolage Grotesque",sans-serif;font-size:1.7rem;font-weight:800;letter-spacing:.01em;white-space:nowrap}
.banner .bx{width:78px;height:78px;margin:0 auto 4px;color:var(--acc)}
.banner .bx svg{width:100%;height:100%}
.banner .dots{display:flex;gap:6px;justify-content:center;margin-bottom:8px}
.banner .dots i{width:20px;height:20px;border-radius:50%;background:var(--acc)}
@keyframes boom{0%{opacity:0;transform:translate(-50%,-50%) scale(.6)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.06)}25%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-60%) scale(1)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* réglages */
.modal{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center}
.panel{background:var(--bg);width:100%;max-width:560px;border-radius:24px 24px 0 0;padding:18px max(16px,env(safe-area-inset-left,0px)) calc(22px + env(safe-area-inset-bottom,0px));max-height:88vh;overflow:auto;display:grid;gap:18px;animation:up .25s ease}
.panel h2{font-size:1.4rem;font-weight:800}
.set{display:grid;gap:8px}
.set>b{font-family:"Bricolage Grotesque",sans-serif;font-size:1.05rem}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.seg .btn{justify-content:center;padding:10px 6px;text-align:center}
.seg .btn.on{background:var(--ink);color:var(--bg);border-color:var(--ink);box-shadow:0 4px 0 var(--plip)}
.switch{appearance:none;width:58px;height:34px;border-radius:99px;background:var(--line);border:0;position:relative;cursor:pointer;flex:none;padding:0}
.switch::after{content:"";position:absolute;top:4px;left:4px;width:26px;height:26px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.switch[aria-checked="true"]{background:var(--ink)}
.switch[aria-checked="true"]::after{left:28px;background:var(--bg)}
.note{font-size:.85rem;color:var(--muted);margin:0}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);border-radius:14px;padding:12px 16px;font-weight:700;z-index:90;max-width:calc(100% - 32px);animation:up .2s ease}
.splash{min-height:70vh;display:grid;place-items:center;text-align:center;gap:14px}
.splash .logo{width:84px;height:84px;border-radius:22px}
.splash .logo svg{width:64px;height:64px}
.splash .logo circle.f{animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.25}}

function blank() { return { v: 2, p: {}, xp: 0, days: {}, goal: 20, sound: true, run: {}, p4: 0, best: 0, mt: 0, hint: false }; }
function load() {
  let s = null;
  try { s = JSON.parse(localStorage.getItem(LS) || "null"); } catch (e) {}
  if (!s) { s = blank(); try { const o = JSON.parse(localStorage.getItem(OLD) || "null"); if (o && typeof o === "object") s.p = o; } catch (e) {} }
  return Object.assign(blank(), s);
}

function save(sid) {

function mergeP(a, b) {
  const out = { ...(a || {}) };
  for (const [k, v] of Object.entries(b || {})) if (v && (!out[k] || (v.t || 0) > (out[k].t || 0))) out[k] = v;
  return out;
}

  for (const sid of Object.keys(remote.p || {})) S.p[sid] = mergeP(S.p[sid], remote.p[sid]);
  const m = remote.meta;
  if (m) {
    S.xp = Math.max(S.xp || 0, m.xp || 0); S.p4 = Math.max(S.p4 || 0, m.p4 || 0); S.best = Math.max(S.best || 0, m.best || 0);

  }
}

  try {
    const cl = window.claude; if (!cl?.use) return;
    const [db, user] = await Promise.all([cl.use("db"), cl.use("user")]);
    if (!db || !user) return;
    const id = await user.id(); if (!id) return;

    storeLabel = "Ta progression est gardée dans ton compte Claude.";
    render();
  } catch (e) {}
}
function flush() {
  const list = [...dirty]; dirty.clear();
  flushing = flushing.then(async () => {
    for (const k of list) {

        if (k === "meta") await DB.doc(`data/users/${UID}/meta`).set({ m: metaOf(S), t: S.mt });

}

  const g = S.goal; let n = 0; const d = new Date();
  if ((S.days[today(d)] || 0) < g) d.setDate(d.getDate() - 1);

  return n;

  let seen = 0, good = 0, errs = 0;

function ring(p, size = 96, w = 11, fg = "#fff", track = "rgba(0,0,0,.22)", txt = "#fff") {
  const r = (size - w) / 2, c = 2 * Math.PI * r, off = c * (1 - p / 100);
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true" style="flex:none"><circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="${track}" stroke-width="${w}"/><circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="${fg}" stroke-width="${w}" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${off}" transform="rotate(-90 ${size / 2} ${size / 2})"/><text x="50%" y="50%" dy=".35em" text-anchor="middle" fill="${txt}" font-family="Bricolage Grotesque, sans-serif" font-weight="800" font-size="${size * .26}">${p}%</text></svg>`;
}
const stars = n => `<span class="stars" aria-label="${n} étoile${n > 1 ? "s" : ""} sur 3">${[0, 1, 2].map(i => `<span class="${i < n ? "on" : "off"}">${I.star}</span>`).join("")}</span>`;

/* ---------- sons ---------- */
let AC = null;
function ac() { if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } if (AC && AC.state === "suspended") AC.resume(); return AC; }
function tone(f, t0, d, type = "sine", g = .12) {
  const a = ac(); if (!a) return; const t = a.currentTime + t0;
  const o = a.createOscillator(), v = a.createGain(); o.type = type; o.frequency.setValueAtTime(f, t);
  v.gain.setValueAtTime(0.0001, t); v.gain.exponentialRampToValueAtTime(g, t + .015); v.gain.exponentialRampToValueAtTime(.0001, t + d);
  o.connect(v); v.connect(a.destination); o.start(t); o.stop(t + d + .03);
}
const SFX = {
  ok() { tone(784, 0, .12); tone(1175, .07, .2); },
  ko() { tone(196, 0, .2, "triangle", .16); tone(147, .1, .26, "triangle", .14); },
  p4() { [523, 659, 784, 1047].forEach((f, i) => tone(f, i * .085, .22, "square", .05)); tone(1319, .36, .4, "sine", .1); },
  goal() { [659, 784, 988, 1319].forEach((f, i) => tone(f, i * .1, .3, "triangle", .1)); },
  end() { [523, 784, 1047].forEach((f, i) => tone(f, i * .12, .35, "sine", .1)); },
  tap() { tone(600, 0, .05, "sine", .04); },
};
function sfx(n) { if (S.sound) try { SFX[n](); } catch (e) {} }

/* ---------- effets ---------- */
const fx = document.getElementById("fx");
const reduced = () => { try { return matchMedia("(prefers-reduced-motion: reduce)").matches; } catch (e) { return false; } };
function rain(colors, n = 40) {
  if (reduced()) return;
  for (let i = 0; i < n; i++) {
    const d = document.createElement("i"); const s = 12 + Math.random() * 18;
    d.className = "disc"; d.style.cssText = `left:${Math.random() * 100}%;width:${s}px;height:${s}px;background:${rnd(colors)};animation-duration:${1.5 + Math.random() * 1.6}s;animation-delay:${Math.random() * .7}s`;
    fx.appendChild(d); setTimeout(() => d.remove(), 4200);
  }
}
function floatTxt(t) { if (reduced()) return; const e = document.createElement("div"); e.className = "float"; e.textContent = t; document.body.appendChild(e); setTimeout(() => e.remove(), 1100); }
function banner(title, sub, glyph) {
  const e = document.createElement("div"); e.className = "banner";
  e.innerHTML = `${glyph ? `<div class="bx">${XF}</div>` : '<div class="dots"><i></i><i></i><i></i><i></i></div>'}<b>${esc(title)}</b><span>${esc(sub)}</span>`;
  document.body.appendChild(e); setTimeout(() => e.remove(), 1600);
}
function toast(t) { const e = document.createElement("div"); e.className = "toast"; e.textContent = t; document.body.appendChild(e); setTimeout(() => e.remove(), 2600); }
const say = t => { const l = document.getElementById("live"); if (l) l.textContent = t; };

/* ---------- navigation ---------- */
let V = { name: "home" };
let Q = null;
function go(v) { fx.innerHTML = ""; V = v; try { history.pushState({ n: v.name }, ""); } catch (e) {} render(); window.scrollTo(0, 0); }
window.addEventListener("popstate", () => {
  fx.innerHTML = "";
  if (document.querySelector(".modal")) { closeModal(); return; }
  if (V.name === "quiz" || V.name === "end") { V = Q && Q.sid ? { name: "subject", sid: Q.sid, open: new Set() } : { name: "home" }; Q = null; }
  else if (V.name === "subject") V = { name: "home" };
  render(); window.scrollTo(0, 0);
});
function render() {
  if (V.name === "home") return renderHome();
  if (V.name === "subject") return renderSubject();
  if (V.name === "quiz") return renderQuiz();
  if (V.name === "end") return renderEnd();
}

/* ---------- accueil ---------- */
function hello() {
  const h = new Date().getHours(), s = streak(), t = S.days[today()] || 0;
  if (t >= S.goal) return "Objectif du jour atteint. Une série de plus ?";
  if (s >= 2) return `${s} jours d'affilée. Ne casse pas ta série !`;
  if (t > 0) return `Encore ${S.goal - t} question${S.goal - t > 1 ? "s" : ""} pour l'objectif du jour.`;
  return h < 12 ? "Bonjour ! Une petite série pour bien commencer ?" : h < 18 ? "Une série maintenant ?" : "Une série avant de dormir ?";
}
function renderHome() {
  setAcc(null);
  const L = lvl(S.xp), t = S.days[today()] || 0, sk = streak();
  const cards = SUBJECTS.map(s => {
    const D = DATA[s.id];
    if (!D) return `<button class="subj" style="--c:var(--${s.id})" disabled><span class="nm">${s.name}</span><small>Pas encore chargé</small></button>`;
    const x = stats(s.id, allIds(s.id));
    return `<button class="subj" style="--c:var(--${s.id})" data-a="subj" data-s="${s.id}"><span class="nm">${s.name}</span><span class="big">${x.p}%</span><span class="bar"><i style="width:${x.p}%"></i></span><small>${fmt(x.total)} questions${x.errs ? ` · ${x.errs} erreur${x.errs > 1 ? "s" : ""}` : ""}</small></button>`;
  }).join("");
  const showHint = !IN_FRAME && !STANDALONE && !S.hint;
  $app.innerHTML = `
  <div class="top"><div class="logo">${LOGO}</div><h1 class="grow">Révisions</h1><button class="icbtn" data-a="settings" aria-label="Réglages">${I.gear}</button></div>
  <p class="hello">${esc(hello())}</p>
  <section class="hud" aria-label="Ta progression">
    <div class="lvl"><div class="lvlnum" aria-label="Niveau ${L.n}">${L.n}</div><div class="grow"><b>Niveau ${L.n}</b><div class="bar" style="margin:6px 0 4px"><i style="width:${Math.round(L.f * 100)}%"></i></div><small>${fmt(L.hi - S.xp)} XP avant le niveau ${L.n + 1}</small></div></div>
    <div class="chips">
      <div class="chip">${I.flame}<b>${sk}</b><span>jour${sk > 1 ? "s" : ""} d'affilée</span></div>
      <div class="chip">${I.bolt}<b>${fmt(S.xp)}</b><span>XP</span></div>

    </div>
  </section>
  <div style="margin-top:16px"><button class="btn primary cta" data-a="express"><span class="mi">${I.play}</span><span class="grow"><b>Série express</b><small>${SESSION} questions, toutes les matières mélangées</small></span>${I.chev}</button></div>
  <div class="sec"><h2>Matières</h2><span class="muted" style="font-size:.85rem">${fmt(SUBJECTS.reduce((n, s) => n + (DATA[s.id]?.questions.length || 0), 0))} questions</span></div>
  <div class="grid">${cards}</div>

}
let deferredPrompt = null;
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); deferredPrompt = e; if (V.name === "home") render(); });
function installHint() {

/* ---------- matière ---------- */
function renderSubject() {
  const sid = V.sid, D = DATA[sid]; setAcc(sid);
  const ids = allIds(sid), x = stats(sid, ids), errs = x.errs, r = runOf(sid);
  const chaps = D.chapters.map(c => {
    const cids = chapIds(sid, c.n), cx = stats(sid, cids), open = V.open.has(c.n);
    const objs = open ? c.objectives.map(o => {
      const ox = stats(sid, objIds(sid, o.k));
      return `<div class="obj"><p><span>Objectif ${o.k.split(".")[1]} · ${ox.p} %</span>${esc(o.t)}</p><button class="btn small" data-a="obj" data-o="${o.k}" aria-label="S'entraîner sur l'objectif ${o.k}">${I.play.replace("<svg", '<svg width="16" height="16"')}</button></div>`;
    }).join("") : "";
    return `<div class="chap"><button data-a="chap" data-n="${c.n}" aria-expanded="${open}"><span class="num ${cx.p >= 90 ? "full" : ""}">${c.n}</span><span class="grow"><span class="t">${esc(c.name)}</span><span class="bar"><i style="width:${cx.p}%"></i></span></span><span>${stars(starsOf(cx.p))}<span class="pc">${cx.p}%</span></span></button>
    ${open ? `<div class="body"><button class="btn acc" data-a="chapgo" data-n="${c.n}">S'entraîner sur ce thème · ${cids.length} questions</button>${objs}</div>` : ""}</div>`;
  }).join("");
  const done = r.i >= r.order.length;
  $app.innerHTML = `
  <div class="head"><button class="icbtn" data-a="home" aria-label="Retour">${I.back}</button><h1 class="grow">${esc(D.name)}</h1></div>

  <div class="modes">
    <button class="btn mode" data-a="mix"><span class="mi">${I.play}</span><span><b>Série rapide</b><small>${SESSION} questions, d'abord les nouvelles et les ratées</small></span><span class="go">${I.chev}</span></button>
    <button class="btn mode" data-a="all"><span class="mi ink">${I.all}</span><span><b>Tout le programme</b><small>${done ? "Terminé ! Touche pour recommencer" : `${fmt(r.i)} / ${fmt(r.order.length)} · reprends où tu t'es arrêté`}</small><span class="bar"><i style="width:${pct(r.i, r.order.length)}%"></i></span></span><span class="go">${I.chev}</span></button>

  </div>

  ${chaps}
  <div class="danger"><button class="btn small" data-a="resetsubj" data-c="0">Remettre ${esc(D.name.toLowerCase())} à zéro</button></div>`;
}

/* ---------- séries ---------- */
function startQuiz(mode, sid, arg, replace) {
  let items = [], title = "";
  if (mode === "express") {
    for (const s of SUBJECTS) if (DATA[s.id]) items.push(...pick(s.id, allIds(s.id), 3).map(id => ({ sid: s.id, id })));
    items = shuffle(items).slice(0, SESSION); title = "Série express"; sid = null;
  } else if (mode === "mix") { items = pick(sid, allIds(sid), SESSION).map(id => ({ sid, id })); title = "Série rapide"; }
  else if (mode === "err") { items = pick(sid, errIds(sid), SESSION).map(id => ({ sid, id })); title = "Mes erreurs"; }
  else if (mode === "chap") { items = pick(sid, chapIds(sid, arg), SESSION).map(id => ({ sid, id })); title = DATA[sid].chapters.find(c => c.n === arg).name; }
  else if (mode === "obj") { items = shuffle(objIds(sid, arg)).map(id => ({ sid, id })); title = "Objectif " + arg; }
  else if (mode === "all") {
    const r = runOf(sid); if (r.i >= r.order.length) { r.order = shuffle(allIds(sid)); r.i = 0; }
    items = r.order.slice(r.i, r.i + RUNLEN).map(id => ({ sid, id })); title = "Tout le programme"; save();
  }
  if (!items.length) { toast("Aucune question ici pour l'instant."); return; }
  Q = { mode, sid, arg, title, items, i: 0, res: [], combo: 0, best: 0, p4: 0, xp: 0, cur: null, done: false, t0: S.days[today()] || 0 };
  ac(); fx.innerHTML = "";
  if (replace) { V = { name: "quiz" }; render(); window.scrollTo(0, 0); } else go({ name: "quiz" });
}
function curItem() {
  const it = Q.items[Q.i];
  if (!Q.cur || Q.cur.k !== Q.i) Q.cur = { k: Q.i, order: shuffle([0, 1, 2, 3]), pick: null };
  return { it, q: qById(it.sid, it.id) };
}
function renderQuiz() {
  const { it, q } = curItem(); setAcc(it.sid);
  const n = Q.items.length, answered = Q.cur.pick !== null;
  const fill = Q.combo % 4 === 0 && Q.combo > 0 && answered ? 4 : Q.combo % 4;
  const anim = Q.cur.anim;
  const opts = Q.cur.order.map((ai, j) => {
    let cls = "", mk = "";
    if (answered) {
      if (ai === 0) { cls = "ok"; mk = I.ok; }
      else if (ai === Q.cur.pick) { cls = "ko"; mk = I.ko; }
      else cls = "dim";
    }
    return `<button class="btn opt ${cls}" data-a="ans" data-i="${ai}" ${answered ? "disabled" : ""}><span class="k">${"ABCD"[j]}</span><span>${esc(q.a[ai])}</span><span class="mk">${mk}</span></button>`;
  }).join("");
  const ok = answered && Q.cur.pick === 0;
  const sheet = answered ? `<div class="sheet" style="--fc:var(--${ok ? "ok" : "ko"});--fb:var(--${ok ? "okbg" : "kobg"})" role="status"><div class="in">
    <h3>${ok ? I.okc : I.koc}${esc(Q.cur.msg)}<span class="xp">+${Q.cur.gain} XP</span></h3>
    ${ok ? "" : `<p><b>Bonne réponse :</b> ${esc(q.a[0])}</p>`}
    <p>${esc(q.x)}</p>
    <button class="btn ${ok ? "acc" : "primary"}" data-a="next" style="${ok ? "--acc:var(--ok)" : ""}">${Q.i + 1 >= n ? "Voir mon score" : "Continuer"}</button></div></div>` : "";
  $app.innerHTML = `
  <div class="qtop"><button class="icbtn" data-a="quit" aria-label="Arrêter la série">${I.close}</button><div class="bar"><i style="width:${pct(Q.i + (answered ? 1 : 0), n)}%"></i></div><span class="cnt">${Q.i + 1}/${n}</span></div>
  ${slotsHTML(fill, anim)}
  <p class="ql">${Q.mode === "express" ? `<span class="tag">${esc(DATA[it.sid].name)}</span><br>` : ""}${esc(label(it.sid, q.o))}</p>
  <h2 class="qq">${esc(q.q)}</h2>
  <div class="opts">${opts}</div>
  ${answered ? '<div class="spacer"></div>' : ""}${sheet}`;
  if (answered) { const b = $app.querySelector('[data-a="next"]'); if (b) b.focus({ preventScroll: true }); }
}
function slotsHTML(fill, anim) {
  return `<div class="combo" aria-label="Série en cours : ${fill} sur 4">${[0, 1, 2, 3].map(i => {
    const on = i < fill; const a = anim === "out" ? " out" : "";
    const st = on && !(anim === "in" && i === fill - 1) ? ' style="animation:none"' : "";
    return `<span class="slot${on ? " on" : ""}${a}"${st}></span>`;
  }).join("")}<span class="pw" aria-hidden="true">x<sup>${fill}</sup></span></div>`;
}
const OKM = ["Bien joué !", "Exact !", "Parfait !", "Bravo !", "Juste !", "Excellent !", "Yes !"];
const KOM = ["Pas cette fois", "Raté, retiens bien celle-là", "Faux, tu la reverras", "Oups"];
function answer(ai) {
  if (!Q || Q.cur?.pick !== null && Q.cur?.pick !== undefined) return;
  const { it } = curItem(); const ok = ai === 0;
  Q.cur.pick = ai;
  const p = S.p[it.sid] || (S.p[it.sid] = {});
  const s = p[it.id] || { n: 0, k: 0, s: 0, e: false, l: false, t: 0 };
  s.n++; s.t = Date.now();
  if (ok) { s.k++; s.s = (s.s || 0) + 1; s.l = true; if (s.e && s.s >= KEEP) s.e = false; }
  else { s.s = 0; s.e = true; s.l = false; }
  p[it.id] = s;
  let gain = ok ? 10 : 2, p4 = false;
  if (ok) { Q.combo++; Q.best = Math.max(Q.best, Q.combo); if (Q.combo % 4 === 0) { p4 = true; gain += 20; Q.p4++; S.p4 = (S.p4 || 0) + 1; } Q.cur.anim = "in"; }
  else { Q.cur.anim = Q.combo > 0 ? "out" : null; Q.combo = 0; }
  S.best = Math.max(S.best || 0, Q.best);
  const before = S.days[today()] || 0; S.days[today()] = before + 1;
  const L0 = lvl(S.xp).n; S.xp += gain; Q.xp += gain; const L1 = lvl(S.xp).n;
  if (Q.mode === "all") { const r = runOf(Q.sid); r.i = Math.min(r.i + 1, r.order.length); }
  Q.res.push({ sid: it.sid, id: it.id, ok });
  Q.cur.gain = gain; Q.cur.msg = ok ? rnd(OKM) : rnd(KOM);
  save(it.sid);
  sfx(ok ? "ok" : "ko"); say(ok ? "Juste" : "Faux");
  renderQuiz();
  floatTxt("+" + gain);
  if (p4) { setTimeout(() => { sfx("p4"); banner("PUISSANCE 4 !", "4 bonnes réponses de suite · +20 XP", true); rain([getComputedStyle(document.documentElement).getPropertyValue(`--${it.sid}`).trim() || "#000", "#000", "#fff"], 22); }, 250); }
  if (before < S.goal && before + 1 >= S.goal) setTimeout(() => { sfx("goal"); banner("OBJECTIF DU JOUR", `${S.goal} questions, bravo !`); }, p4 ? 1700 : 300);
  if (L1 > L0) setTimeout(() => { sfx("goal"); banner(`NIVEAU ${L1}`, "Tu montes de niveau !"); }, p4 ? 3300 : 1700);
}
function next() {
  if (!Q) return;
  if (Q.i + 1 >= Q.items.length) { Q.done = true; sfx("end"); V = { name: "end" }; render(); window.scrollTo(0, 0); return; }
  Q.i++; Q.cur = null; renderQuiz(); window.scrollTo(0, 0);
}
function renderEnd() {
  const good = Q.res.filter(r => r.ok).length, n = Q.res.length, p = pct(good, n);
  setAcc(Q.sid);
  const title = n === 0 ? "Série arrêtée" : p === 100 ? "Sans faute !" : p >= 80 ? "Excellent !" : p >= 60 ? "Bien joué !" : p >= 40 ? "Ça progresse" : "Courage, on remet ça";
  const t = S.days[today()] || 0;
  const miss = Q.res.filter(r => !r.ok).map(r => { const q = qById(r.sid, r.id); return `<div class="m"><span>${esc(q.q)}</span><span><b>✓ ${esc(q.a[0])}</b></span><span class="muted">${esc(q.x)}</span></div>`; }).join("");
  let runInfo = "";
  if (Q.mode === "all") { const r = runOf(Q.sid); runInfo = `<div class="goalbox"><b>Tout le programme · ${fmt(r.i)} / ${fmt(r.order.length)}</b><div class="bar" style="color:var(--acc)"><i style="width:${pct(r.i, r.order.length)}%"></i></div>${r.i >= r.order.length ? "<span>Tu as fait toutes les questions de la matière !</span>" : ""}</div>`; }
  $app.innerHTML = `
  <div class="end">
    <h1>${title}</h1>
    <div class="score">${good}<small> / ${n}</small></div>
    <div class="pills"><span class="pill">${I.bolt} +${Q.xp} XP</span><span class="pill">${XF} ${Q.p4} × Puissance 4</span><span class="pill">${I.flame} série max ${Q.best}</span></div>
    ${runInfo}
    <div class="goalbox"><b>Objectif du jour · ${t} / ${S.goal}</b><div class="bar"><i style="width:${Math.min(100, pct(t, S.goal))}%"></i></div>${t >= S.goal ? "<span>Objectif atteint, ta série de jours continue.</span>" : `<span>Encore ${S.goal - t} question${S.goal - t > 1 ? "s" : ""} aujourd'hui.</span>`}</div>
    <div class="endbtns">
      <button class="btn acc" data-a="again">${Q.mode === "all" && runOf(Q.sid).i < runOf(Q.sid).order.length ? "Continuer le programme" : "Encore une série"}</button>
      <button class="btn" data-a="leave" style="justify-content:center">Retour</button>
    </div>
    ${miss ? `<details class="miss"><summary>À revoir · ${n - good} question${n - good > 1 ? "s" : ""}</summary>${miss}</details>` : ""}
  </div>`;
  if (n && p >= 60) rain([getComputedStyle(document.documentElement).getPropertyValue("--acc").trim() || "#000", "#000", "#9a9a9a"].map(c => c.startsWith("var") ? "#000" : c), p >= 90 ? 60 : 34);
}

/* ---------- réglages ---------- */
function closeModal() { document.querySelector(".modal")?.remove(); }
function openSettings() {
  closeModal();
  const m = document.createElement("div"); m.className = "modal"; m.setAttribute("role", "dialog"); m.setAttribute("aria-label", "Réglages");
  m.innerHTML = `<div class="panel">
    <div class="row"><h2 class="grow">Réglages</h2><button class="icbtn" data-a="closem" aria-label="Fermer">${I.close}</button></div>
    <div class="set"><b>Objectif du jour</b><div class="seg">${[10, 20, 30, 50].map(g => `<button class="btn ${S.goal === g ? "on" : ""}" data-a="goal" data-g="${g}">${g}</button>`).join("")}</div><p class="note">Nombre de questions par jour pour garder ta série de jours.</p></div>
    <div class="set"><div class="row"><b class="grow disp">Sons</b><button class="switch" role="switch" aria-checked="${S.sound}" aria-label="Sons" data-a="sound"></button></div></div>
    <div class="set"><b>Tout effacer</b><button class="btn" data-a="wipe" data-c="0" style="justify-content:center">Remettre toute l'appli à zéro</button></div>
    <p class="note">${esc(storeLabel)}</p>
  </div>`;
  m.addEventListener("click", e => { if (e.target === m) closeModal(); });
  document.body.appendChild(m);
}
function armed(b, label) {
  if (b.dataset.c === "1") return true;
  b.dataset.c = "1"; b.dataset.l = b.textContent; b.textContent = label;
  setTimeout(() => { if (b.isConnected) { b.dataset.c = "0"; b.textContent = b.dataset.l; } }, 3500);
  return false;
}

/* ---------- actions ---------- */
const ACT = {
  subj: b => { ac(); go({ name: "subject", sid: b.dataset.s, open: new Set() }); },
  home: () => history.back(),
  settings: () => openSettings(),
  closem: () => closeModal(),
  express: () => startQuiz("express"),
  mix: () => startQuiz("mix", V.sid),
  all: () => startQuiz("all", V.sid),
  err: () => startQuiz("err", V.sid),
  chap: b => { const n = +b.dataset.n; V.open.has(n) ? V.open.delete(n) : V.open.add(n); renderSubject(); },
  chapgo: b => startQuiz("chap", V.sid, +b.dataset.n),
  obj: b => startQuiz("obj", V.sid, b.dataset.o),
  ans: b => answer(+b.dataset.i),
  next: () => next(),
  quit: () => { if (Q && Q.res.length) { V = { name: "end" }; render(); window.scrollTo(0, 0); } else history.back(); },
  again: () => startQuiz(Q.mode, Q.sid, Q.arg, true),
  leave: () => history.back(),
  hidehint: () => { S.hint = true; save(); render(); },
  install: async () => { if (!deferredPrompt) return; deferredPrompt.prompt(); try { await deferredPrompt.userChoice; } catch (e) {} deferredPrompt = null; render(); },
  goal: b => { S.goal = +b.dataset.g; save(); openSettings(); render(); },
  sound: b => { S.sound = !S.sound; save(); b.setAttribute("aria-checked", S.sound); if (S.sound) sfx("ok"); },
  wipe: b => {
    if (!armed(b, "Touche encore pour tout effacer")) return;
    const keep = { goal: S.goal, sound: S.sound, hint: S.hint }; S = Object.assign(blank(), keep);
    for (const s of SUBJECTS) dirty.add(s.id); save(); closeModal(); render(); toast("Tout est remis à zéro.");
  },
  resetsubj: b => {
    if (!armed(b, "Touche encore pour confirmer")) return;
    S.p[V.sid] = {}; delete S.run[V.sid]; save(V.sid); render(); toast("Matière remise à zéro.");
  },
};
document.addEventListener("click", e => {
  const b = e.target.closest("[data-a]"); if (!b || b.disabled) return;
  const f = ACT[b.dataset.a]; if (f) f(b);
});
document.addEventListener("keydown", e => {
  if (V.name !== "quiz" || !Q || e.metaKey || e.ctrlKey || e.altKey) return;
  if (document.querySelector(".modal")) return;
  const k = e.key.toUpperCase();
  if (Q.cur && Q.cur.pick === null && "ABCD1234".includes(k) && k.length === 1) {
    const j = "ABCD".includes(k) ? "ABCD".indexOf(k) : +k - 1; answer(Q.cur.order[j]); e.preventDefault();
  } else if (Q.cur && Q.cur.pick !== null && (e.key === "Enter" || e.key === " ")) { next(); e.preventDefault(); }
});

/* ---------- démarrage ---------- */
async function boot() {
  try { history.replaceState({ n: "home" }, ""); } catch (e) {}
  const res = await Promise.allSettled(SUBJECTS.map(s => fetch(`${s.id}.json`).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); }).then(d => { DATA[s.id] = d; })));
  if (res.every(r => r.status === "rejected")) {
    $app.innerHTML = `<div class="splash"><div><div class="logo" style="margin:0 auto 14px">${LOGO}</div><b class="disp" style="font-size:1.3rem">Impossible de charger les questions</b><p class="muted">Vérifie ta connexion, puis relance l'appli.</p><button class="btn primary" onclick="location.reload()">Réessayer</button></div></div>`;
    return;
  }
  render();
  initStore();
  if ("serviceWorker" in navigator && !IN_FRAME && /^https?:$/.test(location.protocol)) { try { navigator.serviceWorker.register("sw.js"); } catch (e) {} }
}
boot();
</script>
